<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1613"/><stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0" stop-color="#c9a14a" stop-opacity=".34"/><stop offset="1" stop-color="#c9a14a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d8a85"/><stop offset=".45" stop-color="#f4efe6"/><stop offset="1" stop-color="#9c978f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c570"/><stop offset="1" stop-color="#a97b14"/>
    </linearGradient>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="40" height="40" fill="#efe7d6"/><rect width="20" height="40" fill="#c9a14a"/>
    </pattern>
    <clipPath id="poleClip"><rect x="1000" y="250" width="64" height="470" rx="32"/></clipPath>
    <g id="half">
      <path d="M597 480 L607 112 L630 480 Q613 496 597 480Z" fill="url(#steel)" stroke="#2a2420" stroke-width="1.5"/>
      <path d="M612 130 L618 470" stroke="#fff" stroke-opacity=".55" stroke-width="2" fill="none"/>
      <path d="M606 484 L606 664" stroke="#d4ae55" stroke-width="15" fill="none" stroke-linecap="round"/>
      <ellipse cx="606" cy="728" rx="44" ry="66" fill="none" stroke="url(#gold)" stroke-width="15"/>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="600" cy="400" r="430" fill="url(#glow)"/>

  <!-- mirror arch -->
  <path d="M290 790 V380 A310 310 0 0 1 910 380 V790" fill="none" stroke="#c9a14a" stroke-opacity=".55" stroke-width="2.5"/>
  <path d="M316 790 V380 A284 284 0 0 1 884 380 V790" fill="none" stroke="#c9a14a" stroke-opacity=".22" stroke-width="1.5"/>

  <!-- scissors -->
  <g transform="translate(0 -50)">
    <use href="#half" transform="rotate(14 600 480)"/>
    <use href="#half" transform="translate(1200 0) scale(-1 1) rotate(14 600 480)"/>
    <circle cx="600" cy="480" r="15" fill="url(#gold)" stroke="#2a2420" stroke-width="2"/>
    <circle cx="600" cy="480" r="5" fill="#2a2420"/>
  </g>

  <!-- comb -->
  <g transform="rotate(-14 300 765)">
    <rect x="140" y="716" width="320" height="34" rx="17" fill="url(#gold)"/>
    <g fill="#e6c570" fill-opacity=".92">
      <rect x="150.0" y="742" width="5" height="46" rx="2.5"/><rect x="160.2" y="742" width="5" height="46" rx="2.5"/><rect x="170.4" y="742" width="5" height="46" rx="2.5"/><rect x="180.6" y="742" width="5" height="46" rx="2.5"/><rect x="190.8" y="742" width="5" height="46" rx="2.5"/><rect x="201.0" y="742" width="5" height="46" rx="2.5"/><rect x="211.2" y="742" width="5" height="46" rx="2.5"/><rect x="221.4" y="742" width="5" height="46" rx="2.5"/><rect x="231.6" y="742" width="5" height="46" rx="2.5"/><rect x="241.8" y="742" width="5" height="46" rx="2.5"/><rect x="252.0" y="742" width="5" height="46" rx="2.5"/><rect x="262.2" y="742" width="5" height="46" rx="2.5"/><rect x="272.4" y="742" width="5" height="46" rx="2.5"/><rect x="282.6" y="742" width="5" height="46" rx="2.5"/><rect x="292.8" y="742" width="5" height="46" rx="2.5"/><rect x="303.0" y="742" width="5" height="46" rx="2.5"/><rect x="313.2" y="742" width="5" height="46" rx="2.5"/><rect x="323.4" y="742" width="5" height="46" rx="2.5"/><rect x="333.6" y="742" width="5" height="46" rx="2.5"/><rect x="343.8" y="742" width="5" height="46" rx="2.5"/><rect x="354.0" y="742" width="5" height="46" rx="2.5"/><rect x="364.2" y="742" width="5" height="46" rx="2.5"/><rect x="374.4" y="742" width="5" height="46" rx="2.5"/><rect x="384.6" y="742" width="5" height="46" rx="2.5"/><rect x="394.8" y="742" width="5" height="46" rx="2.5"/><rect x="405.0" y="742" width="5" height="46" rx="2.5"/><rect x="415.2" y="742" width="5" height="46" rx="2.5"/><rect x="425.4" y="742" width="5" height="46" rx="2.5"/><rect x="435.6" y="742" width="5" height="46" rx="2.5"/>
    </g>
  </g>

  <!-- barber pole -->
  <rect x="990" y="226" width="84" height="26" rx="13" fill="url(#gold)"/>
  <rect x="990" y="718" width="84" height="26" rx="13" fill="url(#gold)"/>
  <g clip-path="url(#poleClip)"><rect x="1000" y="250" width="64" height="470" fill="url(#stripes)"/></g>
  <rect x="1000" y="250" width="64" height="470" rx="32" fill="none" stroke="#c9a14a" stroke-opacity=".6" stroke-width="2"/>

  <!-- wordmark -->
  <text x="600" y="842" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="26" fill="#f3ead8">HALDEN</text>
  <text x="600" y="878" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="12" fill="#c9a14a">UNISEX  SALON</text>
</svg>